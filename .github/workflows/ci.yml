name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: anymotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  media-integration:
    name: media-integration (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ANYMOTION_TEST_VOICE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Require native video dependencies (never skip media QA)
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo '::warning::Runner is missing FFmpeg; attempting a bounded native install'
            sudo timeout 120 apt-get update -qq
            sudo timeout 120 apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg || { echo '::error::FFmpeg missing'; exit 1; }
          command -v ffprobe || { echo '::error::FFprobe missing'; exit 1; }
          ffmpeg -hide_banner -encoders 2>&1 | grep 'libx264' >/dev/null || { echo '::error::libx264 encoder missing'; exit 1; }
          node -e "const s=require('sharp'); if(!s.versions.vips)process.exit(1)" || { echo '::error::Sharp native runtime missing'; exit 1; }
      - name: Validate actual media tools
        run: npm run doctor
      - name: Render and mux bilingual technical preview
        run: npm run pipeline:preview -- --sound-design examples/pilot.sound-design.json
      - name: Verify H.264/AAC, duration and artifacts
        run: |
          for lang in es-ES en-US; do
            file="productions/EP0001/locales/$lang/final_preview.mp4"
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx h264
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx aac
          done
          test -s productions/EP0001/release_preview.json
          test -s productions/EP0001/timeline.json
          test -s productions/EP0001/audio/sound-manifest.json
          test -s productions/EP0001/audio/sound-design.json
          test -s productions/EP0001/audio/music.wav
          test -s productions/EP0001/audio/sfx.wav
      - name: Idempotent replay
        run: npm run pipeline:preview -- --sound-design examples/pilot.sound-design.json
