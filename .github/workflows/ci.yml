name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: anymotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  media-integration:
    name: media-integration (skips without native tools)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANYMOTION_TEST_VOICE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - id: capabilities
        name: Inspect native dependencies (never hide unavailable integration coverage)
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 \
            && ffmpeg -hide_banner -decoders 2>&1 | grep -q librsvg \
            && ffmpeg -hide_banner -encoders 2>&1 | grep -q libx264; then
            echo 'media_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'media_ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Media integration NOT VERIFIED on this runner: FFmpeg, FFprobe, librsvg or libx264 missing. Windows/Linux contract tests still run; reproduce multimedia integration on a tool-equipped runner.'
          fi
      - name: Validate actual media tools
        if: steps.capabilities.outputs.media_ready == 'true'
        run: npm run doctor
      - name: Render and mux bilingual technical preview
        if: steps.capabilities.outputs.media_ready == 'true'
        run: npm run pipeline:preview
      - name: Verify H.264/AAC, duration and artifacts
        if: steps.capabilities.outputs.media_ready == 'true'
        run: |
          for lang in es-ES en-US; do
            file="productions/EP0001/locales/$lang/final_preview.mp4"
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx h264
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx aac
          done
          test -s productions/EP0001/release_preview.json
          test -s productions/EP0001/timeline.json
      - name: Idempotent replay
        if: steps.capabilities.outputs.media_ready == 'true'
        run: npm run pipeline:preview
