name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: anymotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  media-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ANYMOTION_TEST_VOICE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure media dependencies are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg && command -v ffprobe
      - name: Use deterministic synthetic voice in CI only
        run: echo "CI uses a synthetic audio fixture, never commercial speech synthesis"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run doctor
      - run: npm run pipeline:preview
      - name: Verify media pipeline with synthetic audio (NOT speech QA)
        run: |
          for lang in es-ES en-US; do
            file="productions/EP0001/locales/$lang/final_preview.mp4"
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx h264
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file" | grep -qx aac
          done
          test -s productions/EP0001/release_preview.json
          test -s productions/EP0001/timeline.json
      - name: Verify idempotency
        run: npm run pipeline:preview
